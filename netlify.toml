[build]
  base    = "frontend"
  command = "npm run build"
  publish = "dist"

# Proxy /api/* to Render backend
[[redirects]]
  from   = "/api/*"
  to     = "https://ava-backend-ob7b.onrender.com/api/:splat"
  status = 200
  force  = true

# SPA fallback for React Router
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
